name: Build ATLAS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack project
        run: unzip -q ATLAS_Futurica_Android_Cloud_Build_Package.zip -d project

      - name: Build APK
        run: |
          DIR=$(dirname "$(find project -name settings.gradle -print -quit)")
          gradle -p "$DIR" --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Android-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
